## Jane control file — converted from config.toml
## Check it with:  jane -t -c jane.conf

# ---------------------------------------------------------------- settings

set cycle 10                              # defaults.cycle
set log syslog level debug                 # or: set log some.log level debug
set hq localhost port 25900

set mailserver myhost port 25
set alert users@company.com cc additional@company.com
# send.from (jane@company.com): no control-file setting; Jane doesn't use it yet
# alert.slack: disabled in config.toml, no control-file setting yet

# include.checks = "/tmp/*.toml" — includes are control files, not TOML:
# include /tmp/*.conf

# ---------------------------------------------------------------- system

check system localhost
    if cpu usage > 2% then alert
    if cpu (wait) > 2% then alert
    if loadavg (1min) > 0.6 then alert
    if loadavg (5min) > 0.9 then alert
    if loadavg (15min) > 15 then alert
    if memory usage > 10, 20, 30 GB then alert
    tag system                           # applies to the cpu results too

# ---------------------------------------------------------------- filesystems

check filesystem home with path /home
    if space usage > 80, 84, 90 % then alert
    # if space usage > 145, 146, 200 GB then alert

check filesystem root with path /
    if space usage > 5 GB then alert

# ---------------------------------------------------------------- files

check directory testdir with path /tmp/testdir

check file hosts with path /etc/hosts
    if failed uid root then alert
    if failed gid root then alert
    if failed permission 7550 then alert

check directory opt with path /opt
    if failed uid root then alert
    if failed gid mreider then alert
    if failed permission 400 then alert

check file nonexistent with path /opt/fakefile
    if failed uid jsmith then alert

# ---------------------------------------------------------------- network

check network em1 with interface em1
    group network

# check host mars with address mars
#     if failed port 22 then alert
#     group trading

check host phoebe with address 192.168.40.23
    if failed port 2660 then alert

# Needs iperf3 on both hosts (iperf3 -s running on atlas); runs for cycle - 1 seconds.
check bandwidth atlas with address atlas   # port 5201 (iperf3 default)
    if bandwidth < 20 Mbps then alert
    group trading, network

# ---------------------------------------------------------------- processes

check process slack matching "/usr/bin/slack"
    group slack

check process gvfsd matching "/usr/libexec/gvfsd"

check process nginx with pidfile /var/run/nginx.pid

check process myapp matching ".*myapp\.sh"

check process zed matching "zed-editor"    # was bin = "zed-editor"

check process sshd matching "sshd: /usr/sbin/sshd -D \[listener\]"
    group process
