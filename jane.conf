## Jane control file — generated by `jane -g`
## Check it with `jane -t -c <file>`; see docs/control-file.md

set cycle 30
set log syslog level debug
set hq localhost port 25900
# set mailserver localhost port 25
# set alert ops@example.com
# include /etc/jane/conf.d/*.conf

check system mrxmac3
    if cpu usage > 80, 85, 90 % for 3 cycles then alert
    if cpu (wait) > 60% for 3 cycles then alert
    if loadavg (5min) per core > 1.5, 2 then alert
    if memory usage > 80, 85, 90, 95 % then alert
    if swap usage > 50% then exec "echo $(date) swap used = $(free -h | grep Swap | awk {'print $3'}) >> /tmp/swap"
    group system

check filesystem root with path /
    if space usage > 85, 90, 95 % then alert
    group filesystems

check filesystem boot with path /boot
    if space usage > 40, 85, 90, 95 % then alert
    if inode usage > 90% then alert
    group filesystems

check filesystem boot-efi with path /boot/efi
    if space usage > 85, 90, 95 % then alert
    group filesystems

check filesystem home with path /home
    if space usage > 85, 90, 95 % then alert
    if inode usage > 90% then alert
    group filesystems

check filesystem mnt-fatboy with path /mnt/fatboy
    if space usage > 85, 90, 95 % then alert
    if inode usage > 90% then alert
    group filesystems

check filesystem var-lib-snapd with path /var/lib/snapd
    if space usage > 85, 90, 95 % then alert
    if inode usage > 90% then alert
    group filesystems

check process sshd matching "/usr/sbin/sshd"
    group process
